<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg{fill:#f7f8fa}.board{fill:#eaf7ec;stroke:#176b3a;stroke-width:4}.old{fill:#fee2e2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}.keep{fill:#fef3c7;stroke:#a16207;stroke-width:2;stroke-dasharray:8 6}.block{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.mech{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.conn{fill:#d1d5db;stroke:#374151;stroke-width:3}.txt{font:16px Arial;fill:#1f2937}.small{font:13px Arial;fill:#374151}.h{font:700 21px Arial;fill:#162033}.title{font:700 30px Arial;fill:#162033}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1500" height="980"/>
  <text class="title" x="55" y="55">PCB placement plan - relay-area redesign</text>
  <text class="txt" x="55" y="84">Concept only; dimensions use the current 146.21 mm x 122.21 mm two-layer board. No routing/fabrication release.</text>
  <rect class="board" x="80" y="125" width="1095" height="733" rx="8"/>
  <text class="small" x="95" y="150">Board coordinate envelope scaled from x=52.69-198.85 mm, y=35.62-157.78 mm</text>
  <rect class="old" x="117" y="157" width="999" height="312" rx="8"/>
  <text class="h" x="380" y="195" fill="#991b1b">Former J7 eight-relay module region (about 133.25 x 52 mm)</text>

  <rect class="mech" x="235" y="255" width="210" height="92" rx="10"/>
  <text class="h" x="290" y="292">Relay A</text><text class="small" x="260" y="320">DPDT: K3 + K4</text>
  <rect class="mech" x="495" y="255" width="210" height="92" rx="10"/>
  <text class="h" x="550" y="292">Relay B</text><text class="small" x="520" y="320">DPDT: K5 + K6</text>
  <rect class="mech" x="755" y="255" width="210" height="92" rx="10"/>
  <text class="h" x="810" y="292">Relay C</text><text class="small" x="777" y="320">DPDT: K7 + K8*</text>
  <text class="small" x="742" y="373">*Only if paired operation is proven; otherwise use two SPDT relays.</text>

  <rect class="block" x="240" y="390" width="720" height="52" rx="8"/>
  <text class="txt" x="390" y="422">Coil drivers, flyback suppression, control test points</text>
  <path class="arrow" d="M340 390 V350"/><path class="arrow" d="M600 390 V350"/><path class="arrow" d="M860 390 V350"/>

  <rect class="conn" x="1088" y="555" width="55" height="245" rx="5"/>
  <text class="h" x="910" y="835">J4 vehicle connector</text>
  <path class="arrow" d="M1020 430 Q1080 470 1105 550"/><text class="small" x="935" y="475">Keep COM/NC routes short</text>

  <rect class="block" x="635" y="675" width="205" height="105" rx="8"/>
  <text class="h" x="680" y="715">DAC module</text><text class="small" x="665" y="744">Keep injection branches</text><text class="small" x="675" y="764">separate to switch pins</text>
  <rect class="block" x="390" y="610" width="180" height="195" rx="8"/>
  <text class="h" x="432" y="687">ESP32</text>
  <rect class="keep" x="390" y="585" width="180" height="62" rx="8"/>
  <text class="small" x="407" y="614">RF antenna keep-out</text><text class="small" x="416" y="634">no copper/components</text>
  <rect class="block" x="875" y="675" width="155" height="105" rx="8"/>
  <text class="h" x="904" y="715">CAN</text><text class="small" x="900" y="744">Separate from</text><text class="small" x="895" y="764">analog routes</text>

  <rect class="conn" x="112" y="610" width="55" height="180" rx="5"/>
  <text class="h" x="90" y="825">Module headers</text>
  <path class="arrow" d="M630 675 Q500 520 460 445"/><text class="small" x="485" y="545">DAC NO paths</text>

  <rect x="1210" y="125" width="245" height="430" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text class="h" x="1240" y="165">Routing constraints</text>
  <text class="txt" x="1235" y="205">- Solid ground reference</text>
  <text class="txt" x="1235" y="238">- No analog/CAN parallelism</text>
  <text class="txt" x="1235" y="271">- No RF keep-out violation</text>
  <text class="txt" x="1235" y="304">- COM/NC pair by function</text>
  <text class="txt" x="1235" y="337">- Test every contact net</text>
  <text class="txt" x="1235" y="370">- Coil loops kept local</text>
  <text class="txt" x="1235" y="403">- Hardware interlock K7/K8</text>
  <text class="txt" x="1235" y="436">- Preserve isolation spacing</text>
  <text class="txt" x="1235" y="469">- Re-run ERC and DRC</text>
  <text class="small" x="1235" y="515">Exact relay bodies depend on</text><text class="small" x="1235" y="535">measured contact and coil needs.</text>

  <rect x="1210" y="590" width="245" height="268" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
  <text class="h" x="1240" y="632" fill="#9f1239">Release gate</text>
  <text class="txt" x="1235" y="675">No vehicle connection until:</text>
  <text class="txt" x="1235" y="710">1. Nets are named/confirmed</text>
  <text class="txt" x="1235" y="745">2. Currents are measured</text>
  <text class="txt" x="1235" y="780">3. Fault states are tested</text>
  <text class="txt" x="1235" y="815">4. Safety review approves</text>
  <text class="small" x="90" y="910">Semiconductor option: place PW prototypes near J4 for test access; use DYY only after validation and assembly-house review. Both options still require passive-bypass resolution.</text>
</svg>
