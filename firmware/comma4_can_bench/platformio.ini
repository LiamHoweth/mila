[platformio]
default_envs = esp32_mcp2515

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -Wextra
  -Werror=return-type

[env:esp32_mcp2515]
build_flags =
  ${env.build_flags}
  -DMILA_CAN_CONTROLLER_MCP2515=1
lib_deps =
  autowp/autowp-mcp2515@1.3.1

[env:esp32_mcp2515_loopback]
build_flags =
  ${env:esp32_mcp2515.build_flags}
  -DMILA_CAN_INTERNAL_LOOPBACK=1
lib_deps =
  ${env:esp32_mcp2515.lib_deps}

[env:esp32_mcp2518fd]
build_flags =
  ${env.build_flags}
  -DMILA_CAN_CONTROLLER_MCP2518FD=1
lib_deps =
  pierremolinaro/ACAN2517FD@2.1.16

[env:esp32_mcp2518fd_loopback]
build_flags =
  ${env:esp32_mcp2518fd.build_flags}
  -DMILA_CAN_INTERNAL_LOOPBACK=1
lib_deps =
  ${env:esp32_mcp2518fd.lib_deps}
